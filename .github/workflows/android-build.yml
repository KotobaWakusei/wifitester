name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_ZIP="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          NDK_DIR="$RUNNER_TEMP/android-ndk-r27c"
          curl --fail --location --retry 3 --retry-delay 2 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip \
            --output "$NDK_ZIP"
          unzip -q "$NDK_ZIP" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_VERSION=27.2.12479018" >> "$GITHUB_ENV"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang" --version

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y flex bison

      - name: Build bundled Android ARM64 tools
        run: bash tools/build-android-toolchain.sh

      - name: Cache the Android runtime of the interface tests
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-runtime-${{ runner.os }}-${{ hashFiles('app/build.gradle') }}

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify bundled tools are packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p "$RUNNER_TEMP/apk-check"
          # tcpdump is mandatory: the passive capture workbench depends on it.
          unzip -l "$APK" | grep -F "assets/toolchain/arm64-v8a/tcpdump"
          unzip -p "$APK" assets/toolchain/arm64-v8a/tcpdump > "$RUNNER_TEMP/apk-check/tcpdump"
          test -s "$RUNNER_TEMP/apk-check/tcpdump"
          file "$RUNNER_TEMP/apk-check/tcpdump"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h "$RUNNER_TEMP/apk-check/tcpdump" | grep -E "Class:|Machine:"
          # The injection tools are optional: report what actually made it in.
          for tool in aircrack-ng airodump-ng aireplay-ng airmon-ng hostapd arpspoof; do
            if unzip -l "$APK" | grep -qF "assets/toolchain/arm64-v8a/$tool"; then
              echo "packaged: $tool"
            else
              echo "not packaged: $tool (feature degrades gracefully)"
            fi
          done

      - name: Verify generated build output is not tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(build|\.gradle)/'; then
            echo 'Generated Gradle/Android outputs must not be committed.' >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wifitester-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
