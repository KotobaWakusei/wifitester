plugins {
    id 'com.android.application'
}

// Release signing is configured through a keystore.properties file that is not
// committed. Without it the release variant still builds, but the resulting
// APK is unsigned and has to be signed before it can be installed.
//
//   keystore.properties
//   --------------------
//   storeFile=/absolute/path/to/wifitester-release.jks
//   storePassword=...
//   keyAlias=wifitester
//   keyPassword=...
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'me.paranoid.wifikill'
    compileSdk 34

    testOptions {
        unitTests.returnDefaultValues = true
    }

    defaultConfig {
        applicationId 'me.paranoid.wifikill'
        minSdk 21
        targetSdk 34
        versionCode 2023
        versionName '2.5.0'
    }

    signingConfigs {
        if (keystoreProperties.containsKey("storeFile")) {
            release {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // The workbenches are instantiated by their fully qualified class
            // name (Fragment.instantiate), so the classes must survive the
            // shrinker. The keep rules live in proguard-rules.pro.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties.containsKey("storeFile")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        xmlReport true
    }

    buildFeatures {
        buildConfig = false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    // Material 3 components + AppCompat runtime (day/night, per-app locales).
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
}
