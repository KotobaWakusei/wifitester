plugins {
    id 'com.android.application'
}

android {
    namespace 'me.paranoid.wifikill'
    compileSdk 34

    testOptions {
        unitTests.returnDefaultValues = true
    }

    defaultConfig {
        applicationId 'me.paranoid.wifikill'
        minSdk 21
        targetSdk 34
        versionCode 2021
        versionName '2.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    buildFeatures {
        buildConfig = false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
