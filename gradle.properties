org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:-UseContainerSupport
org.gradle.parallel=true

# The UI layer is built on AndroidX (AppCompat + Material Components).
android.useAndroidX=true
# The resource identifiers have to stay in sync with the packaged resource
# table. The legacy non transitive and non final resource id modes made the
# compiled constants point to identifiers that do not exist in the APK, which
# surfaced as Resources.NotFoundException at runtime.
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Legacy decompiled sources rely on final resource IDs in switch statements.
android.enableJetifier=false
